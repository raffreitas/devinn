name: devinn

services:
  devinn.webapi:
    image: devinn.webapi
    build:
      context: .
      dockerfile: src/DevInn.WebApi/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DatabaseConnection=Host=postgres;Database=devinn;Username=postgres;Password=postgres;Pooling=true;
  
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devinn
    ports:
      - "5432:5432"
    volumes:
      - devinn_pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  aspire:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    ports:
      - "18888:18888"
      - "4317:18889"

volumes:
  devinn_pgdata: