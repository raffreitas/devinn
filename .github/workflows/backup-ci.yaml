name: Backup CI

on:
  push:
    branches: [main]
    paths:
      - "apps/backup/**"
      - ".github/workflows/backup-ci.yaml"
  pull_request:
    paths:
      - "apps/backup/**"
      - ".github/workflows/backup-ci.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"

concurrency:
  group: backup-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test Backup
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet
          key: backup-nuget-${{ runner.os }}-dotnet-${{ hashFiles('apps/backup/**/*.csproj') }}
          restore-keys: |
            backup-nuget-${{ runner.os }}-dotnet-

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        working-directory: apps/backup
        run: dotnet restore DevInn.Backup.slnx

      - name: Build
        working-directory: apps/backup
        run: dotnet build DevInn.Backup.slnx --no-restore --configuration Release --verbosity minimal

      - name: Test
        working-directory: apps/backup
        run: dotnet test DevInn.Backup.slnx --no-restore --no-build --configuration Release --verbosity normal
