name: CI/CD Railway

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "24"

jobs:
  ci:
    name: Build & Test (JS + .NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js (with pnpm cache)
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          # cache: "pnpm"
          # cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Install JS dependencies (workspace)
        run: pnpm install --frozen-lockfile

      - name: Build JS workspaces
        run: pnpm build:web

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet
          key: nuget-${{ runner.os }}-dotnet-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-dotnet-

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET packages
        run: dotnet restore

      - name: Build .NET projects
        run: dotnet build --no-restore --configuration Release --verbosity minimal

      - name: Run .NET tests
        run: dotnet test --no-build --verbosity normal

  deploy:
    name: Deploy to Production (manual)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dotnet tools & dependencies (Makefile)
        working-directory: apps/api
        run: make setup

      - name: Run EF migrations (Apply DB migrations)
        working-directory: apps/api
        env:
          ConnectionStrings__DatabaseConnection: ${{ secrets.DATABASE_CONNECTION_STRING }}
          ASPNETCORE_ENVIRONMENT: Production
        run: make migrate-all

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Railway deploy
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          # login may be a no-op when token is present; tolerate failures
          railway login --apiKey "$RAILWAY_API_TOKEN" || true
          # `railway up` or `railway deploy` depending on your CLI version / workflow; adjust if needed
          railway up --yes --project "$RAILWAY_PROJECT_ID" || railway deploy --project "$RAILWAY_PROJECT_ID"

  release:
    name: Create Release on tag
    runs-on: ubuntu-latest
    needs: ci
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create GitHub Release for tag
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: "Automated release for ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
