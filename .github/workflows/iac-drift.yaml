name: Infrastructure Drift Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/iac-drift.yaml"
      - ".railway/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - ".github/workflows/iac-drift.yaml"
      - ".railway/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24
  PNPM_VERSION: 10

concurrency:
  group: infrastructure-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan-railway-configuration:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    name: Plan Railway configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Railway drift
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: pnpm railway:plan:ci
