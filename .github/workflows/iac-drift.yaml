name: IaC Drift Check

on:
  pull_request:
    paths:
      - ".github/workflows/iac-drift.yaml"
      - ".railway/**"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

env:
  NODE_VERSION: 24
  PNPM_VERSION: 10

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan Railway config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.23.1

      - name: Check Railway drift
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: pnpm railway:plan:ci
